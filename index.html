<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KUMBAKARANA Food Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') no-repeat center center/cover;
      backdrop-filter: blur(4px);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      width: 85%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.55);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      font-size: 2.8rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #ffcf33;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 8px #ffc107; }
      to { text-shadow: 0 0 20px #ffdf66; }
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .food-grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 15px;
      transition: 0.3s;
    }

    .food-grid img:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px #ffe27a;
    }

    .tagline {
      text-align: center;
      font-size: 1.3rem;
      margin: 10px auto 25px;
      letter-spacing: 1px;
    }

    .chatbot-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      text-align: center;
      animation: slideUp 1.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>KUMBAKARANA Food Assistant</h1>
    <p class="tagline">Your smart foodie buddy for recipes, cravings & meal ideas 🍲</p>

    <div class="food-grid">
      <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092" alt="Burger">
      <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" alt="Pasta">
      <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352" alt="Healthy Bowl">
      <img src="https://images.unsplash.com/photo-1553621042-f6e147245754" alt="Pizza">
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" alt="Steak">
      <img src="https://images.unsplash.com/photo-1562967914-608f82629710" alt="Indian Food">
    </div>

    <div class="chatbot-box">
      <h2>🍽 Talk to Your Food Assistant</h2>
      <p>Ask for recipes, cooking tips, diet suggestions, or meal plans!</p>

      <!-- Watson Assistant Script -->
      <script>
        window.watsonAssistantChatOptions = {
          integrationID: "e245f2fd-9ba4-419a-8400-a58adefaf91d",
          region: "eu-de",
          serviceInstanceID: "b4929931-b8d3-4dbc-8e96-2ac820d48d16",
          onLoad: async (instance) => { await instance.render(); }
        };
        setTimeout(function(){
          const t=document.createElement('script');
          t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" +
            (window.watsonAssistantChatOptions.clientVersion || 'latest') +
            "/WatsonAssistantChatEntry.js";
          document.head.appendChild(t);
        });
      </script>
    </div>
  </div>
</body>
</html>
